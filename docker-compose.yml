# secnews-omv: RSS reader (Miniflux) + push notifications (ntfy) for OpenMediaVault
# Versions checked on 2026-10-17:
#   miniflux 2.3.3 (released 2026-07-24), postgres 18 (as in the official Miniflux example),
#   ntfy v2.31.0 (version in docs.ntfy.sh/install)
# Requires Docker Compose v2. Deployed and running on OMV with Docker; see README.md.

name: secnews

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_DB: miniflux
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      # Postgres 18 uses /var/lib/postgresql (17 and older: /var/lib/postgresql/data)
      - miniflux-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s
    networks:
      - backend          # internal network: no internet access, not published on the host

  miniflux:
    image: miniflux/miniflux:2.3.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MINIFLUX_PORT:-8180}:8080"
    environment:
      LISTEN_ADDR: "0.0.0.0:8080"
      BASE_URL: "http://${OMV_HOST:?set OMV_HOST in .env}:${MINIFLUX_PORT:-8180}"
      DATABASE_URL_FILE: /run/secrets/miniflux_database_url
      RUN_MIGRATIONS: "1"
      # Creates the admin on first start; can be removed afterwards (see README)
      CREATE_ADMIN: "1"
      ADMIN_USERNAME_FILE: /run/secrets/miniflux_admin_username
      ADMIN_PASSWORD_FILE: /run/secrets/miniflux_admin_password
      # Since 2.2.18, integrations can't reach private networks by default (SSRF hardening).
      # Required so Miniflux can publish to the local ntfy container.
      INTEGRATION_ALLOW_PRIVATE_NETWORKS: "1"
      # Every 10 min, pick the feeds that are due; each feed is fetched at most
      # every 30 min (default 60). My choice, adjust to taste.
      POLLING_FREQUENCY: "10"
      SCHEDULER_ROUND_ROBIN_MIN_INTERVAL: "30"
      LOG_DATE_TIME: "1"
      TZ: Europe/Bucharest
    secrets:
      - miniflux_database_url
      - miniflux_admin_username
      - miniflux_admin_password
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 60s
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - frontend

  ntfy:
    image: binwiederhier/ntfy:v2.31.0
    command: ["serve"]
    restart: unless-stopped
    init: true           # recommended by the docs when using a healthcheck
    ports:
      - "${NTFY_PORT:-8190}:80"
    environment:
      TZ: Europe/Bucharest
      NTFY_BASE_URL: "http://${OMV_HOST}:${NTFY_PORT:-8190}"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      # Default 12h. 48h so the phone catches up after being off the home network.
      NTFY_CACHE_DURATION: "48h"
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
    volumes:
      - ntfy-data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  miniflux-db:
  ntfy-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  miniflux_database_url:
    file: ./secrets/miniflux_database_url
  miniflux_admin_username:
    file: ./secrets/miniflux_admin_username
  miniflux_admin_password:
    file: ./secrets/miniflux_admin_password
